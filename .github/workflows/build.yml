# Compila y prueba NVMeForge en un runner de GitHub (requisito de SignPath: compilación verificable
# a partir del código del repositorio). Las versiones etiquetadas vX.Y.Z suben el .exe como artefacto.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Pruebas unitarias
        run: zig build test

      - name: Compilar
        run: zig build --release=fast

      - name: Subir ejecutable sin firmar
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: NVMeForge-sin-firmar
          path: zig-out/bin/NVMeForge.exe
          if-no-files-found: error

      # Firma con SignPath Foundation. Activar cuando SignPath apruebe el proyecto:
      # 1) agregar el secreto SIGNPATH_API_TOKEN al repositorio;
      # 2) poner los valores que da SignPath (organization-id, project-slug, signing-policy-slug);
      # 3) quitar los comentarios de este paso.
      # - name: Firmar con SignPath
      #   if: startsWith(github.ref, 'refs/tags/v')
